name: publish-v2220
on:
  push:
    paths:
      - '.github/workflows/publish-v2220.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch APK
        run: |
          curl -fsSL -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789673991.5deb4083d63d630a/w1w4NrVJrwmU/self-reliance-foco.apk'
          echo '95a51b723ef6c9f89e07122f991599046536a00c9f0c44c06f1e87a67f97dcd8  Self-Reliance-FoCo.apk' | sha256sum -c
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$'# Self-Reliance FoCo v2.22.0\n\nTrash day polish: cart / recycling / yard rows match the rest of the list, and the dropdown now lists regions for Fort Collins, Loveland, Estes Park, Berthoud, Wellington, and unincorporated Larimer. Highlander Heights is still Friday. Loveland neighborhoods use Recollect for the house-level day \u2014 we did not invent weekdays. Poudre Valley Early Head Start and El Nidito are on Families. 429 listings. versionCode 28 \u2014 installs over v2.21.0.\n\nSHA-256: 95a51b723ef6c9f89e07122f991599046536a00c9f0c44c06f1e87a67f97dcd8\n'
          if gh release view v2.22.0 --repo TheMilkmanJ/SelfReliance-FoCo >/dev/null 2>&1; then
            gh release upload v2.22.0 Self-Reliance-FoCo.apk --clobber --repo TheMilkmanJ/SelfReliance-FoCo
          else
            gh release create v2.22.0 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.22.0' --notes "$NOTES"
          fi
      - uses: actions/checkout@v4
      - name: Record checksum and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          t = p.read_text()
          old = 'To verify the published APK: `sha256` pending release build.'
          new = '`sha256: 95a51b723ef6c9f89e07122f991599046536a00c9f0c44c06f1e87a67f97dcd8`'
          if old in t:
              p.write_text(t.replace(old, new))
          PY
          rm -f .github/workflows/publish-v2220.yml
          git add README.md .github/workflows/publish-v2220.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Record the v2.22.0 APK checksum and remove the publish workflow.'
          git push
