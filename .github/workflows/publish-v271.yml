name: publish-v271

on:
  push:
    paths:
      - ".github/workflows/publish-v271.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay v2.7.1 source and attach APK
        env:
          SRC_URL: https://tmpfiles.org/dl/1789528343.f69580e98cb42a6b/wewuqdvpsmmY/foco-v271-src.tgz
          APK_URL: https://tmpfiles.org/dl/1789528343.46901f74b96fe700/wmwTqlvFs7Py/self-reliance-foco.apk
          EXPECT_SHA: 93e4f4cd4109c7fedb5c277ddf01456c8613c8d6117a9d2ef5f0eaf62943a35d
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/foco-v271-src.tgz "$SRC_URL"
          tar -xzf /tmp/foco-v271-src.tgz -C .
          python3 -c 'import json,sys; n=len(json.load(open("src/data/resources.json"))["resources"]); print("listings", n); sys.exit(0 if n==264 else 1)'
          grep -q "uchealth-fmc-med9-resources" src/data/resources.json
          grep -q "ask for Robert" src/data/resources.json
          test -f download-qr.svg
          grep -q "Download%20v2.7.1" README.md
          grep -q "93e4f4cd4109c7fedb5c277ddf01456c8613c8d6117a9d2ef5f0eaf62943a35d" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -80
          git diff --cached --quiet || git commit -m "Release v2.7.1: downstairs resource desk (ask for Robert)"
          git push origin HEAD:main
          curl -fsSL -o Self-Reliance-FoCo.apk "$APK_URL"
          echo "$EXPECT_SHA  Self-Reliance-FoCo.apk" | sha256sum -c -
          gh release delete v2.7.1 --yes || true
          git tag -f v2.7.1
          git push -f origin v2.7.1
          gh release create v2.7.1 Self-Reliance-FoCo.apk --title "Self-Reliance FoCo v2.7.1" --notes-file release-notes-v271.md --latest
