name: restore-listings-v260

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-listings-v260.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore 218 listings and retire one-shot workflows
        run: |
          set -euo pipefail
          curl -fsSL -o src/data/resources.json https://litter.catbox.moe/wlo87v.json
          echo "6a00dc37b3291fc1ce3f67bd85022478090b9e8542aa5795fa227897cefd3d55  src/data/resources.json" | sha256sum -c
          python3 - <<'PY'
          import json
          data = json.load(open("src/data/resources.json"))
          n = len(data["resources"])
          wr = sum(1 for r in data["resources"] if r.get("certGroup") == "work_ready")
          assert n == 218, n
          assert wr == 10, wr
          print("ok", n, "work_ready", wr)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/attach-v260.yml .github/workflows/restore-listings-v260.yml
          git add src/data/resources.json
          git add -A .github/workflows
          git status
          git commit -m "Restore 218 listings and retire one-shot v2.6.0 workflows"
          git push
