name: ingest-v2221
on:
  push:
    paths:
      - '.github/workflows/ingest-v2221.yml'
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack overlay
        run: |
          curl -fsSL -o /tmp/pack.tgz 'https://tmpfiles.org/dl/1789674425.fdbbf45d8f38fe37/wBwxNbVgmKqo/foco-v2221.tgz'
          tar xzf /tmp/pack.tgz
      - name: Commit overlay
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md app.json package.json scripts/check-ehs.mjs .github/workflows/check-source.yml src/data/resources.json src/data/resources.ts src/screens/HomeScreen.tsx release-notes-v2221.md
          git diff --cached --quiet && echo 'no overlay changes' || git commit -m 'Put Poudre Valley Early Head Start first on Families and Child Care.'
          git push
      - name: Remove this workflow
        run: |
          rm -f .github/workflows/ingest-v2221.yml
          git add .github/workflows/ingest-v2221.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove one-shot ingest workflow.'
          git push
