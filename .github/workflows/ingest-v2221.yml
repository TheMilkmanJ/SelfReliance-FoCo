name: ingest-v2221
on:
  push:
    paths:
      - '.github/workflows/ingest-v2221.yml'
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack overlay
        run: |
          set -eux
          curl -fsSL -o /tmp/pack.tgz 'https://tmpfiles.org/dl/1789674425.fdbbf45d8f38fe37/wBwxNbVgmKqo/foco-v2221.tgz'
          tar tzf /tmp/pack.tgz
          tar xzf /tmp/pack.tgz
          test -f src/data/resources.ts
          test -f scripts/check-ehs.mjs
          test -f src/screens/HomeScreen.tsx
      - name: Commit overlay
        run: |
          set -eux
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md app.json package.json scripts/check-ehs.mjs src/data/resources.json src/data/resources.ts src/screens/HomeScreen.tsx release-notes-v2221.md
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'no overlay changes'
          else
            git commit -m 'Put Poudre Valley Early Head Start first on Families and Child Care.'
            git pull --rebase origin main
            git push
          fi
      - name: Remove this workflow
        run: |
          set -eux
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/ingest-v2221.yml
          git add .github/workflows/ingest-v2221.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove one-shot ingest workflow.'
          git pull --rebase origin main
          git push
