name: overlay-v2190

on:
  push:
    paths:
      - ".github/workflows/overlay-v2190.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch APK
        run: |
          set -euo pipefail
          URL="https://tmpfiles.org/dl/1789625693.d6dc414b466f9ffc/wrwZqD8huQzO/self-reliance-foco.apk"
          curl -L --fail --retry 8 --retry-all-errors -o Self-Reliance-FoCo.apk "$URL"
          echo "002e760aeef1a2f91dd5aa0875bc05c4499af7163a0088ce5ca18bf96c5b5532  Self-Reliance-FoCo.apk" | sha256sum -c -
          python3 - <<'P'
          import pathlib
          p = pathlib.Path("Self-Reliance-FoCo.apk")
          magic = p.read_bytes()[:2]
          if magic != b"PK":
              raise SystemExit(f"not a zip/apk: {magic!r} size={p.stat().st_size}")
          print("apk_ok", p.stat().st_size)
          P
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete v2.19.0 --yes || true
          git push origin :refs/tags/v2.19.0 || true
          gh release create v2.19.0 Self-Reliance-FoCo.apk \
            --title "Self-Reliance FoCo v2.19.0" \
            --notes-file release-notes-v2190.md
      - name: Remove overlay workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/overlay-v2190.yml
          git commit -m "Remove one-shot overlay workflow."
          git push
