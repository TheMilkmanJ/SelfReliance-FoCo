name: publish-v22411

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v22411.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overlay source
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o foco-source-v22411.tgz 'https://tmpfiles.org/dl/1789758123.1495dccb93bcc036/wiwDNR9TKogD/foco-source-v22411.tgz'
          echo 'ab2e36cec190c5a283f320007217aa66909933b906d4a5f9fa9bfac3cce35e8f  foco-source-v22411.tgz' | sha256sum -c
          tar -xzf foco-source-v22411.tgz
          rm -f foco-source-v22411.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.json scripts/check-trash.mjs src/screens/TrashDayScreen.tsx src/components/HomeTools.tsx src/components/TrashZoneSelect.tsx src/i18n src/lib/trashCalendar.ts src/lib/trashPrefs.ts
          if git diff --cached --quiet; then
            echo 'source already current'
          else
            git commit -m 'Overlay v2.24.11 source: trash day tracks every Larimer town.'
            git pull --rebase origin main || true
            git push origin HEAD
          fi
      - name: Fetch APK
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789758025.1195e60d9bff39dd/wZwiN59UgcaX/self-reliance-foco.apk'
          ls -lah Self-Reliance-FoCo.apk
          echo 'e067649c3ba53e383128d5b782111c4427f4d45c041e44f3bf5284d6acfe0f16  Self-Reliance-FoCo.apk' | sha256sum -c
          python3 -c "import zipfile; assert zipfile.is_zipfile('Self-Reliance-FoCo.apk')"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          # Self-Reliance FoCo v2.24.11

          Loveland, Estes Park, Berthoud, and Wellington track Out today / Usual pickup the same way as Fort Collins. Pick the neighborhood, then the weekday Recollect or the bill shows. The phone remembers that day per neighborhood. This app does not invent Loveland map days. versionCode 44 — installs over v2.24.10.

          SHA-256: e067649c3ba53e383128d5b782111c4427f4d45c041e44f3bf5284d6acfe0f16
          EOF
          gh release delete v2.24.11 --yes --cleanup-tag --repo TheMilkmanJ/SelfReliance-FoCo || true
          gh release create v2.24.11 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.24.11' --notes-file notes.md
      - name: Delete this workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-v22411.yml
          git add .github/workflows/publish-v22411.yml || true
          git pull --rebase origin main || true
          if git diff --cached --quiet; then
            echo 'workflow already gone'
          else
            git commit -m 'Remove one-shot v2.24.11 publish workflow.' || true
            git push origin HEAD || true
          fi
