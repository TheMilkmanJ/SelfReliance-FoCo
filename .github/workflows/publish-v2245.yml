name: publish-v2245

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v2245.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overlay source
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o foco-source-v2245.tgz 'https://tmpfiles.org/dl/1789712148.5963472ebd23ab47/wuwDN10IURVV/foco-source-v2245.tgz'
          echo 'c9479c5bd6111e58c457a4692e59012ed842585fe7cf4255a251e7b2d389c47a  foco-source-v2245.tgz' | sha256sum -c
          tar -xzf foco-source-v2245.tgz
          rm -f foco-source-v2245.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.json src/components/LanguagePicker.tsx
          if git diff --cached --quiet; then
            echo 'source already current'
          else
            git commit -m 'Overlay v2.24.5 source: language list keeps finger-scroll.'
            git pull --rebase origin main || true
            git push origin HEAD
          fi
      - name: Fetch APK
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789712124.c85d78cc343ca480/wGwhNB0CMWk9/self-reliance-foco.apk'
          ls -lah Self-Reliance-FoCo.apk
          echo 'bcc231bad838549f379a20e9988aa827420d4092ed16a4cc6bce99a1470bc81d  Self-Reliance-FoCo.apk' | sha256sum -c
          python3 -c "import zipfile; assert zipfile.is_zipfile('Self-Reliance-FoCo.apk')"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          # Self-Reliance FoCo v2.24.5

          Language dropdown keeps the finger-scroll. Swiping the list no longer moves the page behind it. versionCode 38 — installs over v2.24.4.

          SHA-256: bcc231bad838549f379a20e9988aa827420d4092ed16a4cc6bce99a1470bc81d
          EOF
          gh release delete v2.24.5 --yes --cleanup-tag --repo TheMilkmanJ/SelfReliance-FoCo || true
          gh release create v2.24.5 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.24.5' --notes-file notes.md
      - name: Delete this workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-v2245.yml
          git add .github/workflows/publish-v2245.yml || true
          git pull --rebase origin main || true
          if git diff --cached --quiet; then
            echo 'workflow already gone'
          else
            git commit -m 'Remove one-shot v2.24.5 publish workflow.' || true
            git push origin HEAD || true
          fi
