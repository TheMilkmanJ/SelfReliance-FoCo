name: append-love-like-jeremy

on:
  push:
    branches: [data/love-like-jeremy]
    paths:
      - ".github/workflows/append-love-like-jeremy.yml"

jobs:
  append:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/love-like-jeremy
      - name: Append Love Like Jeremy to resources.json
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          p = Path("src/data/resources.json")
          data = json.loads(p.read_text())
          llj = json.loads("""{"id": "love-like-jeremy", "name": "Love Like Jeremy (Facebook group)", "category": "shelter", "description": "Community Facebook group that helps people who are unhoused in the Fort Collins / Northern Colorado area \u2014 ask for leads on food, gear, rides, and other aid. Join on Facebook to post or respond; it is not a shelter desk or overnight bed.", "phone": null, "url": "https://www.facebook.com/groups/lovelikejeremy", "address": null, "hours": "Online; check the group for posts", "area": "Larimer County", "tags": ["homeless", "unhoused", "facebook", "community", "mutual aid", "outreach"]}""")
          if any(r.get("id") == "love-like-jeremy" for r in data["resources"]):
              print("already present")
          else:
              data["resources"].append(llj)
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
              print("appended; count=", len(data["resources"]))
          PY
      - name: Commit resources and remove bootstrap workflow
        run: |
          git config user.name "TheMilkmanJ"
          git config user.email "pulfordj420@gmail.com"
          git add src/data/resources.json
          if ! git diff --staged --quiet; then
            git commit -m "Add Love Like Jeremy Facebook group for unhoused help"
          fi
          if [ -f .github/workflows/append-love-like-jeremy.yml ]; then
            git rm .github/workflows/append-love-like-jeremy.yml
            git commit -m "Remove one-shot Love Like Jeremy bootstrap workflow"
          fi
          git push origin HEAD:data/love-like-jeremy
