name: publish-v2247

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v2247.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overlay source
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o foco-source-v2247.tgz 'https://tmpfiles.org/dl/1789713380.04b12091a0c87cb5/wywfNC0qvKRe/foco-source-v2247.tgz'
          echo '1ed7fea401ff72aa5b1e620d67545c23cb870799c4963bc2815bc78e82f145af  foco-source-v2247.tgz' | sha256sum -c
          tar -xzf foco-source-v2247.tgz
          rm -f foco-source-v2247.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.json src/screens/TrashDayScreen.tsx src/components/HomeTools.tsx src/i18n
          if git diff --cached --quiet; then
            echo 'source already current'
          else
            git commit -m 'Overlay v2.24.7 source: Trash day weekday in large type.'
            git pull --rebase origin main || true
            git push origin HEAD
          fi
      - name: Fetch APK
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789713379.f6af056082041579/wjwENR0Fv9iP/self-reliance-foco.apk'
          ls -lah Self-Reliance-FoCo.apk
          echo 'b83bdd797b5302eb849ebaadb40885e6d2b8dc57e11532c886d71bdf64e66ad6  Self-Reliance-FoCo.apk' | sha256sum -c
          python3 -c "import zipfile; assert zipfile.is_zipfile('Self-Reliance-FoCo.apk')"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          # Self-Reliance FoCo v2.24.7

          Trash day shows the weekday in large type. Highlander Heights still goes out Friday. Cart rows say Goes out Friday, or Friday · out today when the truck is coming. versionCode 40 — installs over v2.24.6.

          SHA-256: b83bdd797b5302eb849ebaadb40885e6d2b8dc57e11532c886d71bdf64e66ad6
          EOF
          gh release delete v2.24.7 --yes --cleanup-tag --repo TheMilkmanJ/SelfReliance-FoCo || true
          gh release create v2.24.7 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.24.7' --notes-file notes.md
      - name: Delete this workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-v2247.yml
          git add .github/workflows/publish-v2247.yml || true
          git pull --rebase origin main || true
          if git diff --cached --quiet; then
            echo 'workflow already gone'
          else
            git commit -m 'Remove one-shot v2.24.7 publish workflow.' || true
            git push origin HEAD || true
          fi
