name: publish-v2-3-0
on:
  push:
    branches:
      - cursor/v230-certs-7eac
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch signed APK
        run: |
          curl -sSL -o Self-Reliance-FoCo.apk "https://tmpfiles.org/dl/1789239468.18d21bcbad28981f/wpwEPU5wDlUU/self-reliance-foco.apk"
          echo "64f8d5a3a84cb62e1c8303c62f498a87cbc73f552efa09ed2fdf0e109c80be55  Self-Reliance-FoCo.apk" | sha256sum -c
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.3.0 --repo TheMilkmanJ/SelfReliance-FoCo --yes --cleanup-tag || true
          gh release create v2.3.0 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title "Self-Reliance FoCo v2.3.0" --notes-file release-notes-v230.md --latest
