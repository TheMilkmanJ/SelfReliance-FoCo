name: publish-v2-3-0
on:
  push:
    branches:
      - cursor/v230-ship-7eac
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch signed APK
        run: |
          curl -sSL -o Self-Reliance-FoCo.apk https://litter.catbox.moe/dr99n6.apk
          echo "2acfa7af7c627c2b1859b0bf7520aebf1d7d5158d4646def349da291320cf396  Self-Reliance-FoCo.apk" | sha256sum -c
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v2.3.0 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title "Self-Reliance FoCo v2.3.0" --notes-file release-notes-v230.md
