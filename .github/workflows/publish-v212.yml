name: publish-v212

on:
  push:
    paths:
      - ".github/workflows/publish-v212.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overlay source, attach APK, delete this workflow
        env:
          SRC_PAGE: https://tmpfiles.org/wEwYqOBPnAHB/foco-v212-src.tgz
          APK_PAGE: https://tmpfiles.org/wZwCqaBMny9v/self-reliance-foco.apk
          EXPECT_SHA: b03deabaeec820dd6464daada641b2d095c832098008f71045351d7190980860
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          download_tmp() {
            local page="$1" out="$2" i html href
            for i in 1 2 3 4; do
              html=$(curl -fsSL -A "Mozilla/5.0" "$page") || true
              href=$(printf "%s" "$html" | tr '"' '\n' | grep -E '^https://tmpfiles.org/dl/' | head -n1)
              if [ -n "$href" ] && curl -fsSL -A "Mozilla/5.0" -o "$out" "$href"; then
                return 0
              fi
              sleep $((i * 4))
            done
            echo "failed to download $page" >&2
            return 1
          }
          download_tmp "$SRC_PAGE" /tmp/src.tgz
          tar xzf /tmp/src.tgz
          python3 -c 'import json,sys; n=len(json.load(open("src/data/resources.json"))["resources"]); print("listings", n); sys.exit(0 if n==348 else 1)'
          grep -q until-theyre-home src/data/resources.json
          grep -q 720-893-0504 src/data/resources.json
          grep -q noco-humane-larimer src/data/resources.json
          grep -q csu-vet-emergency src/data/resources.json
          grep -q Download%20v2.12.0 README.md
          grep -q b03deabaeec820dd6464daada641b2d095c832098008f71045351d7190980860 README.md
          download_tmp "$APK_PAGE" Self-Reliance-FoCo.apk
          echo "$EXPECT_SHA  Self-Reliance-FoCo.apk" | sha256sum -c
          rm -f .github/workflows/publish-v212.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json README.md release-notes-v2120.md docs/flyer.html src/data/categories.ts src/data/resources.ts src/data/resources.json
          git add -u .github/workflows/publish-v212.yml
          git commit -m "Release v2.12.0 Pets listings overlay."
          git push
          gh release create v2.12.0 Self-Reliance-FoCo.apk --title "Self-Reliance FoCo v2.12.0" --notes-file release-notes-v2120.md
