name: publish-v2249

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v2249.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overlay source
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o foco-source-v2249.tgz 'https://tmpfiles.org/dl/1789723663.0d44db0396d944ea/wFwMNptBJxmy/foco-source-v2249.tgz'
          echo '39b99834cafe30bb0fa4a7786ac51e4023ce9470ee1dd56c526a62236d49e482  foco-source-v2249.tgz' | sha256sum -c
          tar -xzf foco-source-v2249.tgz
          rm -f foco-source-v2249.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.json scripts/check-trash.mjs src/components/TrashZoneSelect.tsx src/i18n src/lib/trashCalendar.ts src/screens/TrashDayScreen.tsx
          if git diff --cached --quiet; then
            echo 'source already current'
          else
            git commit -m 'Overlay v2.24.9 source: mapped trash day ignores Friday chip.'
            git pull --rebase origin main || true
            git push origin HEAD
          fi
      - name: Fetch APK
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789723663.1a7c8762a1f309e9/wIwuNFt2Ja4m/self-reliance-foco.apk'
          ls -lah Self-Reliance-FoCo.apk
          echo 'c83f46422ff41b432a742468038d5cb8dddc8b7b659046e982fb8175b442f833  Self-Reliance-FoCo.apk' | sha256sum -c
          python3 -c "import zipfile; assert zipfile.is_zipfile('Self-Reliance-FoCo.apk')"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          # Self-Reliance FoCo v2.24.9

          East of College around Horsetooth stays Tuesday. After you pick a mapped Fort Collins neighborhood, weekday chips are hidden so a Friday tap cannot mark it Out today. versionCode 42 — installs over v2.24.8.

          SHA-256: c83f46422ff41b432a742468038d5cb8dddc8b7b659046e982fb8175b442f833
          EOF
          gh release delete v2.24.9 --yes --cleanup-tag --repo TheMilkmanJ/SelfReliance-FoCo || true
          gh release create v2.24.9 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.24.9' --notes-file notes.md
      - name: Delete this workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-v2249.yml
          git add .github/workflows/publish-v2249.yml || true
          git pull --rebase origin main || true
          if git diff --cached --quiet; then
            echo 'workflow already gone'
          else
            git commit -m 'Remove one-shot v2.24.9 publish workflow.' || true
            git push origin HEAD || true
          fi
