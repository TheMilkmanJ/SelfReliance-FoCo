name: publish-v2222
on:
  push:
    paths:
      - '.github/workflows/publish-v2222.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch APK
        run: |
          curl -fsSL -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789675303.c7b1880af5f21703/wQwdNPLO6VaT/self-reliance-foco.apk'
          echo 'ddac06ffb5e26fc04c133526d4dd1ac19c53d9a2fc81860220070348bc4d5f4b  Self-Reliance-FoCo.apk' | sha256sum -c
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$'# Self-Reliance FoCo v2.22.2\n\nHighlander Heights is the Friday east-of-College trash listing (the old East of College, north of Drake row is folded into it). Trash cart / recycling / yard rows use the same purple listing as Call / Look up, with Not today on the title line. versionCode 30 — installs over v2.22.1.\n\nSHA-256: ddac06ffb5e26fc04c133526d4dd1ac19c53d9a2fc81860220070348bc4d5f4b\n'
          if gh release view v2.22.2 --repo TheMilkmanJ/SelfReliance-FoCo >/dev/null 2>&1; then
            gh release upload v2.22.2 Self-Reliance-FoCo.apk --clobber --repo TheMilkmanJ/SelfReliance-FoCo
          else
            gh release create v2.22.2 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.22.2' --notes "$NOTES"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record checksum and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          t = p.read_text()
          old = 'To verify the published APK: `sha256` pending release build.'
          new = '`sha256: ddac06ffb5e26fc04c133526d4dd1ac19c53d9a2fc81860220070348bc4d5f4b`'
          if old in t:
              p.write_text(t.replace(old, new))
          PY
          rm -f .github/workflows/publish-v2222.yml
          git add README.md .github/workflows/publish-v2222.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Record the v2.22.2 APK checksum and remove the publish workflow.'
          git pull --rebase origin main
          git push
