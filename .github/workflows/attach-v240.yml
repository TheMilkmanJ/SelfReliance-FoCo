name: attach-v240
on:
  push:
    branches: [cursor/v240-apk-7eac]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch APK
        run: |
          set -euo pipefail
          curl -fsSL -o Self-Reliance-FoCo.apk "https://tmpfiles.org/dl/1789246310.cbe50743ed314e08/wHwuPz0mEPLc/self-reliance-foco.apk"
          echo "6c78951f2aeb396581784d0ff4567c8e7bceaf09394db37aa8b9f42714a896b6  Self-Reliance-FoCo.apk" | sha256sum -c
          ls -l Self-Reliance-FoCo.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: Self-Reliance FoCo v2.4.0
          make_latest: true
          fail_on_unmatched_files: true
          files: Self-Reliance-FoCo.apk
          body: |
            Certificate types plus more free, checkable credentials.

            The **Jobs** tab now splits free certificates by type: Coding, IT & cloud, Marketing, Government, Business, and Computer basics. New listings include FEMA Independent Study, IRS VITA/TCE certification, Colorado Mandatory Reporter training, CareerOneStop Certification Finder, My Colorado Journey, SBA Learning, Intuit Academy, Northstar Digital Literacy, GCFGlobal, AWS Skill Builder, and Google Cloud Skills Boost.

            155 listings. versionCode 8 — installs over any earlier FoCo build, including v2.3.0.

            SHA-256: `6c78951f2aeb396581784d0ff4567c8e7bceaf09394db37aa8b9f42714a896b6`

            The QR code and download button still use `/releases/latest/download/Self-Reliance-FoCo.apk`.
