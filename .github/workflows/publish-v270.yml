name: publish-v270

on:
  push:
    paths:
      - ".github/workflows/publish-v270.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay v2.7.0 source and attach APK
        env:
          SRC_URL: https://tmpfiles.org/dl/1789527771.9fa01466ea2578e3/wdwkqIviuF8A/foco-v270-src.tgz
          APK_URL: https://tmpfiles.org/dl/1789527776.c87af36bb16ac420/w3wDqcvB9qKK/self-reliance-foco.apk
          EXPECT_SHA: ee924aa7f86d910064cf394fec768aeb591dcc0c4038ada6cb6b06e2d4cdbfc8
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/foco-v270-src.tgz "$SRC_URL"
          tar -xzf /tmp/foco-v270-src.tgz -C .
          python3 - <<'PY'
          import json
          data = json.load(open("src/data/resources.json"))
          n = len(data["resources"])
          print("listings", n)
          if n != 263:
              raise SystemExit(f"expected 263 listings, got {n}")
          PY
          test -f download-qr.svg
          grep -q "Download%20v2.7.0" README.md
          grep -q "ee924aa7f86d910064cf394fec768aeb591dcc0c4038ada6cb6b06e2d4cdbfc8" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -80
          git diff --cached --quiet || git commit -m "Release v2.7.0: Have a disability? tab and 263 listings"
          git push origin HEAD:main
          curl -fsSL -o Self-Reliance-FoCo.apk "$APK_URL"
          echo "$EXPECT_SHA  Self-Reliance-FoCo.apk" | sha256sum -c -
          gh release delete v2.7.0 --yes || true
          git tag -f v2.7.0
          git push -f origin v2.7.0
          gh release create v2.7.0 Self-Reliance-FoCo.apk \
            --title "Self-Reliance FoCo v2.7.0" \
            --notes-file release-notes-v270.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
