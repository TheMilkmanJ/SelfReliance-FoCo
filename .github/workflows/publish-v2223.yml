name: publish-v2223
on:
  push:
    paths:
      - '.github/workflows/publish-v2223.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overlay source
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o overlay.tgz 'https://tmpfiles.org/dl/1789676480.e3350a6f9ab2ec37/wqw7N1LqytG5/foco-overlay-2223.tgz'
          tar -xzf overlay.tgz
          mkdir -p src/screens
          mv -f TrashDayScreen.tsx src/screens/TrashDayScreen.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/screens/TrashDayScreen.tsx README.md release-notes-v2223.md app.json
          git diff --cached --quiet || git commit -m 'Match trash cart rows to directory listing cards.'
          git pull --rebase origin main
          git push
      - name: Fetch APK
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789676480.de64b97c9ff11aaf/wTwUNNL0y6sN/self-reliance-foco.apk'
          echo 'a21a34d1c2b720ec6ff8a83feaea9712d34dea27af2104a655b9029977549edc  Self-Reliance-FoCo.apk' | sha256sum -c
          python3 -c "import zipfile; assert zipfile.is_zipfile('Self-Reliance-FoCo.apk')"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$'# Self-Reliance FoCo v2.22.3\n\nTrash cart, recycling, and yard trimmings use the same listing cards as the directory. Highlander Heights stays the Friday east-of-College listing. versionCode 31 — installs over v2.22.2.\n\nSHA-256: a21a34d1c2b720ec6ff8a83feaea9712d34dea27af2104a655b9029977549edc\n'
          if gh release view v2.22.3 --repo TheMilkmanJ/SelfReliance-FoCo >/dev/null 2>&1; then
            gh release upload v2.22.3 Self-Reliance-FoCo.apk --clobber --repo TheMilkmanJ/SelfReliance-FoCo
          else
            gh release create v2.22.3 --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.22.3' --notes "$NOTES"
            gh release upload v2.22.3 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo
          fi
      - name: Record checksum and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          t = p.read_text()
          old = 'To verify the published APK: `sha256` pending release build.'
          new = '`sha256: a21a34d1c2b720ec6ff8a83feaea9712d34dea27af2104a655b9029977549edc`'
          if old in t:
              p.write_text(t.replace(old, new))
          PY
          rm -f .github/workflows/publish-v2223.yml
          git add README.md .github/workflows/publish-v2223.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Record the v2.22.3 APK checksum and remove the publish workflow.'
          git pull --rebase origin main
          git push
