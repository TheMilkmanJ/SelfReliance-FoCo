name: publish-v2221
on:
  push:
    paths:
      - '.github/workflows/publish-v2221.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch APK
        run: |
          curl -fsSL -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789674920.3302dd37ac2a3bca/wEwhN5LBwihK/self-reliance-foco.apk'
          echo '469eac53aaa85701684a573b9b7812891d44b7f6c55d09ae575be085d0e0a54e  Self-Reliance-FoCo.apk' | sha256sum -c
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$'# Self-Reliance FoCo v2.22.1\n\nPoudre Valley Early Head Start is first on Families & Kids and also shows on Child Care. El Nidito is the center-based classroom. Head Start preschool stays on its original card. versionCode 29 — installs over v2.22.0.\n\nSHA-256: 469eac53aaa85701684a573b9b7812891d44b7f6c55d09ae575be085d0e0a54e\n'
          if gh release view v2.22.1 --repo TheMilkmanJ/SelfReliance-FoCo >/dev/null 2>&1; then
            gh release upload v2.22.1 Self-Reliance-FoCo.apk --clobber --repo TheMilkmanJ/SelfReliance-FoCo
          else
            gh release create v2.22.1 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.22.1' --notes "$NOTES"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record checksum and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          t = p.read_text()
          old = 'To verify the published APK: `sha256` pending release build.'
          new = '`sha256: 469eac53aaa85701684a573b9b7812891d44b7f6c55d09ae575be085d0e0a54e`'
          if old in t:
              p.write_text(t.replace(old, new))
          PY
          rm -f .github/workflows/publish-v2221.yml
          git add README.md .github/workflows/publish-v2221.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Record the v2.22.1 APK checksum and remove the publish workflow.'
          git pull --rebase origin main
          git push
