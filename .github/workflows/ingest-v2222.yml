name: ingest-v2222
on:
  push:
    paths:
      - '.github/workflows/ingest-v2222.yml'
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack overlay
        run: |
          set -eux
          curl -fsSL -o /tmp/pack.tgz 'https://tmpfiles.org/dl/1789675222.cabf3cfe58bba6f5/wnwINALhg6YD/foco-v2222.tgz'
          tar tzf /tmp/pack.tgz
          tar xzf /tmp/pack.tgz
          test -f src/screens/TrashDayScreen.tsx
          test -f src/data/trashZones.json
      - name: Commit overlay
        run: |
          set -eux
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md app.json release-notes-v2222.md scripts/check-trash.mjs src/data/trashZones.json src/data/trashZones.ts src/screens/TrashDayScreen.tsx
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'no overlay changes'
          else
            git commit -m 'Match trash-day carts to Call/Look up and fold Friday east into Highlander Heights.'
            git pull --rebase origin main
            git push
          fi
      - name: Remove this workflow
        run: |
          set -eux
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/ingest-v2222.yml
          git add .github/workflows/ingest-v2222.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove one-shot ingest workflow.'
          git pull --rebase origin main
          git push
