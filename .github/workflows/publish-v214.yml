name: publish-v214

on:
  push:
    paths:
      - ".github/workflows/publish-v214.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overlay source, attach APK, delete this workflow
        env:
          SRC_PAGE: https://tmpfiles.org/wCwyq7slzh06/foco-v214-src.tgz
          APK_PAGE: https://tmpfiles.org/wNwTq2smzKyU/self-reliance-foco.apk
          EXPECT_SHA: 84bb30909a436b71295fe4c8be9722d5853b111ff5afbf3b4740ab3343be6038
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          download_tmp() {
            local page="$1" out="$2" i html href
            for i in 1 2 3 4; do
              html=$(curl -fsSL -A "Mozilla/5.0" "$page") || true
              href=$(printf "%s" "$html" | tr '"' '\n' | grep -E '^https://tmpfiles.org/dl/' | head -n1)
              if [ -n "$href" ] && curl -fsSL -A "Mozilla/5.0" -o "$out" "$href"; then
                return 0
              fi
              sleep $((i * 4))
            done
            echo "failed to download $page" >&2
            return 1
          }
          download_tmp "$SRC_PAGE" /tmp/src.tgz
          tar xzf /tmp/src.tgz
          python3 -c 'import json,sys; n=len(json.load(open("src/data/resources.json"))["resources"]); print("listings", n); sys.exit(0 if n==402 else 1)'
          grep -q sava-center src/data/resources.json
          grep -q 'Closed May 31, 2025' src/data/resources.json
          grep -q salvation-army-care-closet src/data/resources.json
          grep -q va-clinic-fort-collins src/data/resources.json
          grep -q Download%20v2.14.0 README.md
          grep -q 84bb30909a436b71295fe4c8be9722d5853b111ff5afbf3b4740ab3343be6038 README.md
          download_tmp "$APK_PAGE" Self-Reliance-FoCo.apk
          echo "$EXPECT_SHA  Self-Reliance-FoCo.apk" | sha256sum -c
          rm -f .github/workflows/publish-v214.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json README.md release-notes-v2140.md docs/flyer.html src/data/resources.ts src/data/resources.json
          git add -u .github/workflows/publish-v214.yml
          git commit -m "Release v2.14.0 thin-tile desks overlay."
          git push
          gh release create v2.14.0 Self-Reliance-FoCo.apk --title "Self-Reliance FoCo v2.14.0" --notes-file release-notes-v2140.md
