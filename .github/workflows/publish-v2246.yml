name: publish-v2246

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v2246.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overlay source
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o foco-source-v2246.tgz 'https://tmpfiles.org/dl/1789712964.2336008e83d59f11/wewUNg09yOuk/foco-source-v2246.tgz'
          echo 'e22f0f6f6b81df8eb4431a9ece8ccbaa7468dd954f1c81d279e6951253f5fc46  foco-source-v2246.tgz' | sha256sum -c
          tar -xzf foco-source-v2246.tgz
          rm -f foco-source-v2246.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.json App.tsx \
            src/lib/backStack.ts \
            src/components/LanguagePicker.tsx src/components/OpenNowDetail.tsx src/components/ResourceDetail.tsx \
            src/screens/GiveNeedScreen.tsx src/screens/HomeScreen.tsx src/screens/OfflineMapsScreen.tsx \
            src/screens/OpenNowScreen.tsx src/screens/TrashDayScreen.tsx
          if git diff --cached --quiet; then
            echo 'source already current'
          else
            git commit -m 'Overlay v2.24.6 source: swipe-back returns to the previous screen.'
            git pull --rebase origin main || true
            git push origin HEAD
          fi
      - name: Fetch APK
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789712963.61d436a3d8fbf69c/wPwHNx0nyO3T/self-reliance-foco.apk'
          ls -lah Self-Reliance-FoCo.apk
          echo 'ae502270b0dce8aab1875e626e388f3fd7a9c0cd751cb197f712058e7d0dac87  Self-Reliance-FoCo.apk' | sha256sum -c
          python3 -c "import zipfile; assert zipfile.is_zipfile('Self-Reliance-FoCo.apk')"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          # Self-Reliance FoCo v2.24.6

          Swipe back from a listing, category, tool screen, language sheet, or other tab returns to the previous screen. The app only exits when you swipe back on Resources home. versionCode 39 — installs over v2.24.5.

          SHA-256: ae502270b0dce8aab1875e626e388f3fd7a9c0cd751cb197f712058e7d0dac87
          EOF
          gh release delete v2.24.6 --yes --cleanup-tag --repo TheMilkmanJ/SelfReliance-FoCo || true
          gh release create v2.24.6 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.24.6' --notes-file notes.md
      - name: Delete this workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-v2246.yml
          git add .github/workflows/publish-v2246.yml || true
          git pull --rebase origin main || true
          if git diff --cached --quiet; then
            echo 'workflow already gone'
          else
            git commit -m 'Remove one-shot v2.24.6 publish workflow.' || true
            git push origin HEAD || true
          fi
