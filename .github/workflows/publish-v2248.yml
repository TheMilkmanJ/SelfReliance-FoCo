name: publish-v2248

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v2248.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overlay source
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o foco-source-v2248.tgz 'https://tmpfiles.org/dl/1789722992.4aca92cd9e1c1011/wfwBNJt1ZmLf/foco-source-v2248.tgz'
          echo '8d887d2f7b1f1cda69c0d9ad54400c3c15b714856bbdda66c8454eef21cd0fd7  foco-source-v2248.tgz' | sha256sum -c
          tar -xzf foco-source-v2248.tgz
          rm -f foco-source-v2248.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.json scripts/check-trash.mjs src/components/TrashZoneSelect.tsx src/i18n src/lib/trashCalendar.ts src/screens/TrashDayScreen.tsx
          if git diff --cached --quiet; then
            echo 'source already current'
          else
            git commit -m 'Overlay v2.24.8 source: Horsetooth stays Tuesday; drop Goes out copy.'
            git pull --rebase origin main || true
            git push origin HEAD
          fi
      - name: Fetch APK
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o Self-Reliance-FoCo.apk 'https://tmpfiles.org/dl/1789722991.dd9a028720445e9b/wHwYN5tYZVV2/self-reliance-foco.apk'
          ls -lah Self-Reliance-FoCo.apk
          echo 'a5b97ead071b4adf651feb752d81b0a9cb48fb852da8d3d56f6c56e1643121e5  Self-Reliance-FoCo.apk' | sha256sum -c
          python3 -c "import zipfile; assert zipfile.is_zipfile('Self-Reliance-FoCo.apk')"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          # Self-Reliance FoCo v2.24.8

          East of College around Horsetooth stays Tuesday. Leftover Friday from another neighborhood does not say Out today. Cart rows say Tuesday, or Out today when the truck is coming — not Goes out Tuesday. versionCode 41 — installs over v2.24.7.

          SHA-256: a5b97ead071b4adf651feb752d81b0a9cb48fb852da8d3d56f6c56e1643121e5
          EOF
          gh release delete v2.24.8 --yes --cleanup-tag --repo TheMilkmanJ/SelfReliance-FoCo || true
          gh release create v2.24.8 Self-Reliance-FoCo.apk --repo TheMilkmanJ/SelfReliance-FoCo --title 'Self-Reliance FoCo v2.24.8' --notes-file notes.md
      - name: Delete this workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-v2248.yml
          git add .github/workflows/publish-v2248.yml || true
          git pull --rebase origin main || true
          if git diff --cached --quiet; then
            echo 'workflow already gone'
          else
            git commit -m 'Remove one-shot v2.24.8 publish workflow.' || true
            git push origin HEAD || true
          fi
