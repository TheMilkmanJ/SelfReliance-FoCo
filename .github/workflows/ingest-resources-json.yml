name: ingest-resources-json

on:
  push:
    paths:
      - '.github/workflows/ingest-resources-json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch resources.json
        run: |
          set -euo pipefail
          page=$(curl -fsSL "https://tmpfiles.org/wJw5N6VyX3KU/resources.json")
          url=$(printf '%s' "$page" | grep -oE 'https://tmpfiles.org/dl/[^"]+resources.json' | head -1)
          test -n "$url"
          curl -fL --retry 3 -o src/data/resources.json "$url"
          echo "b781a054065e1616070400f4f922cece5c48e941d4baa672723ba251fa1635e8  src/data/resources.json" | sha256sum -c
          python3 - <<'PY'
          import hashlib, pathlib
          d = pathlib.Path("src/data/resources.json").read_bytes()
          blob = hashlib.sha1(b"blob %d\x00" % len(d) + d).hexdigest()
          assert blob == "7633856eb4e10bc791ff28ee3721e1523ec5401a", blob
          PY
      - name: Commit resources.json and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/resources.json
          git rm .github/workflows/ingest-resources-json.yml
          git commit -m "Add Pregnancy & Birth listings and birthing-option chips."
          git push
