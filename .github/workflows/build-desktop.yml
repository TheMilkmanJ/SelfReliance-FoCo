name: build-desktop

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-desktop.yml"

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist-web
      - name: Build Windows installer
        run: npx electron-builder --win nsis --config electron-builder.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: release/Self-Reliance-FoCo-Setup.exe
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/Self-Reliance-FoCo-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist-web
      - name: Build Mac DMG
        run: npx electron-builder --mac dmg --config electron-builder.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/Self-Reliance-FoCo.dmg
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/Self-Reliance-FoCo.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
