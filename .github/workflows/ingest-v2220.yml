name: ingest-v2220
on:
  push:
    paths:
      - '.github/workflows/ingest-v2220.yml'
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack overlay
        run: |
          curl -fsSL -o /tmp/pack.tgz 'https://tmpfiles.org/dl/1789673913.dca0cb603aee9fb4/whw5NeVlCpSQ/foco-v2220.tgz'
          tar xzf /tmp/pack.tgz
      - name: Commit overlay
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md app.json scripts/check-trash.mjs src/components/TrashZoneSelect.tsx src/data/resources.json src/data/trashZones.json src/data/trashZones.ts src/lib/trashCalendar.ts src/screens/TrashDayScreen.tsx release-notes-v2220.md
          git diff --cached --quiet && echo 'no overlay changes' || git commit -m 'Match trash-day carts to the list and add other Larimer town regions.'
          git push
      - name: Remove this workflow
        run: |
          rm -f .github/workflows/ingest-v2220.yml
          git add .github/workflows/ingest-v2220.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove one-shot ingest workflow.'
          git push
