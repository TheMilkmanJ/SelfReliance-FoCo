name: overlay-v2200

on:
  push:
    paths:
      - '.github/workflows/overlay-v2200.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch signed APK
        run: |
          set -euo pipefail
          page=$(curl -fsSL "https://tmpfiles.org/wtwNN1VGMB2d/self-reliance-foco.apk")
          url=$(printf '%s' "$page" | grep -oE 'https://tmpfiles.org/dl/[^"]+self-reliance-foco.apk' | head -1)
          test -n "$url"
          curl -fL --retry 3 -o Self-Reliance-FoCo.apk "$url"
          echo "26249e9364e8fe4a2c5a9aa430ad1c666f0a58b114b5883db33dbb89fb1bd7ed  Self-Reliance-FoCo.apk" | sha256sum -c
          test "$(stat -c%s Self-Reliance-FoCo.apk)" -gt 10000000
      - name: Publish v2.20.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.20.0 Self-Reliance-FoCo.apk \
            --repo TheMilkmanJ/SelfReliance-FoCo \
            --title "Self-Reliance FoCo v2.20.0" \
            --notes-file release-notes-v2200.md
      - name: Remove overlay workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/overlay-v2200.yml
          git commit -m "Remove one-shot v2.20.0 overlay workflow."
          git push
